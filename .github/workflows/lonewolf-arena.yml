name: Lone Wolf Arena - build APK and test on Android emulator

on:
  push:
    branches: [main]
    paths:
      - "LoneWolfArena/**"
      - ".github/workflows/lonewolf-arena.yml"
  pull_request:
    paths:
      - "LoneWolfArena/**"
      - ".github/workflows/lonewolf-arena.yml"
  workflow_dispatch:
    inputs:
      reference_app:
        description: "Private probe instead of the normal run: package of a reference app to look at on the emulator"
        type: string
        default: ""
      results_key:
        description: "Base64 of the RSA public key (PEM) the probe's results are encrypted with"
        type: string
        default: ""
      nav_minutes:
        description: "Probe: minutes of reading the screen and tapping through (0 = screenshots only)"
        type: string
        default: "0"
      testlab_minutes:
        description: "Probe on a real phone (Firebase Test Lab, secret GCP_TESTLAB_KEY) for this many minutes instead of the emulator (0 = emulator)"
        type: string
        default: "0"

permissions:
  contents: read

# A newer push to the same branch / PR supersedes the running check.
concurrency:
  group: lonewolf-arena-${{ github.ref }}-${{ inputs.reference_app || 'ci' }}
  cancel-in-progress: true

jobs:
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.reference_app == ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      GODOT_VERSION: "4.7.2"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The token is not left in .git/config for the build to find.
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Install Godot and Android export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          unzip -q -j "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" "templates/android_*" "templates/version.txt" -d "$dest"
          rm -f ./*.tpz ./*.zip
          godot --version

      - name: Configure Godot for the Android SDK
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          for f in editor_settings-4.tres editor_settings-4.7.tres; do
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "%s"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' \
              "$ANDROID_HOME" "${JAVA_HOME_17_X64:-$JAVA_HOME}" "$HOME/.android/debug.keystore" > "$HOME/.config/godot/$f"
          done

      - name: Import, compile, unit tests, headless match and gameplay checks
        working-directory: LoneWolfArena
        run: tools/qa/run_checks.sh

      - name: Export signed APK (throwaway CI key, emulator build)
        working-directory: LoneWolfArena
        run: |
          mkdir -p build
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/ci.keystore" -alias ci -keyalg RSA -keysize 2048 -validity 1000 \
            -storepass cipass123 -keypass cipass123 -dname "CN=CI"
          # The game checks its own signing certificate against the list in res://build_keys.gd
          # (autoload/guard.gd); the emulator test expects "[LoneWolf] signature ok".
          SIGNER="$(keytool -list -v -keystore "$RUNNER_TEMP/ci.keystore" -alias ci -storepass cipass123 \
            | grep -m1 "SHA256:" | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f')"
          [[ "$SIGNER" =~ ^[0-9a-f]{64}$ ]]
          SECRET="$(head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          printf '# CI build (throwaway key).\nconst SIGNERS := ["%s"]\nconst SAVE_SECRET := "%s"\n' "$SIGNER" "$SECRET" > build_keys.gd
          godot --headless --path . --import > /dev/null 2>&1 || true
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/ci.keystore" GODOT_ANDROID_KEYSTORE_RELEASE_USER=ci \
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=cipass123 \
            godot --headless --path . --export-release "Android-x86_64" build/LoneWolfArena.apk
          ls -la build
          test -s build/LoneWolfArena.apk

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and play on Android emulator (API 34, x86_64)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          disable-animations: true
          emulator-boot-timeout: 480
          # The emulator's software GL (SwiftShader) cannot link Godot's GLES3 shaders, so the screen
          # stays blank; the test checks install, START, FIRE, joystick and stability via log markers.
          # (guest gives the same result; swangle_indirect is too slow to start the app.)
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash LoneWolfArena/tools/ci/emulator_test.sh LoneWolfArena/build/LoneWolfArena.apk emulator-results

      - name: Summarize emulator results
        if: always()
        run: |
          ls -la emulator-results || true
          echo "== markers"; cat emulator-results/markers.txt 2>/dev/null || true
          echo "== crashes"; cat emulator-results/crashes.txt 2>/dev/null || true
          echo "== godot errors"; grep -v "   at: " emulator-results/godot_errors.txt 2>/dev/null | sort | uniq -c | sort -rn | head -20 || true
          python3 -m pip install -q --break-system-packages pillow 2>/dev/null || python3 -m pip install -q pillow || true
          for f in emulator-results/*.png; do
            python3 - "$f" <<'PY' || true
          import sys
          from PIL import Image, ImageStat
          g = Image.open(sys.argv[1]).convert("L")
          dark = sum(g.histogram()[:16]) / float(g.width * g.height)
          print("STAT", sys.argv[1], "size=%dx%d" % g.size, "mean=%.1f" % ImageStat.Stat(g).mean[0], "dark=%.2f" % dark)
          PY
          done

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lonewolf-arena-ci
          path: |
            emulator-results
            LoneWolfArena/build/LoneWolfArena.apk
          retention-days: 14

  # Manual runs only: a private look at a reference app on the emulator (screens and log, see
  # LoneWolfArena/tools/ci/reference_probe.sh). The app comes from a public APK mirror through
  # apkeep (EFF); it runs only inside this throwaway emulator, and its signer is recorded so a
  # re-signed copy is noticed. The results are uploaded encrypted with the public key given at
  # dispatch and kept for a day, so the run publishes nothing of the probed app.
  reference:
    if: github.event_name == 'workflow_dispatch' && inputs.reference_app != '' && inputs.testlab_minutes == '0'
    runs-on: ubuntu-latest
    timeout-minutes: 170
    defaults:
      run:
        shell: bash
    env:
      APP_ID: ${{ inputs.reference_app }}
      RESULTS_KEY: ${{ inputs.results_key }}
      NAV_MINUTES: ${{ inputs.nav_minutes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Week of the year (the app is fetched again once a week)
        id: week
        run: echo "w=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      # The app and its downloaded game data (no account files) carry over between runs.
      - name: Restore the app from an earlier run
        id: app_cache
        uses: actions/cache/restore@v4
        with:
          path: ref_app
          key: ref-app-${{ inputs.reference_app }}-${{ steps.week.outputs.w }}

      - name: Restore the game data from an earlier run
        uses: actions/cache/restore@v4
        with:
          path: ref_state
          key: ref-state-${{ inputs.reference_app }}-${{ github.run_id }}
          restore-keys: ref-state-${{ inputs.reference_app }}-

      - name: Fetch the app and show its signer
        run: |
          [[ "$APP_ID" =~ ^[A-Za-z0-9._]+$ ]]
          [[ "$NAV_MINUTES" =~ ^[0-9]{1,3}$ ]]
          mkdir -p ref_app
          if ! ls ref_app/*.apk > /dev/null 2>&1; then
            curl -fsSL --retry 3 -o apkeep https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu
            chmod +x apkeep
            ./apkeep -a "$APP_ID" -d apk-pure -o acknowledge_dangers=true ref_app
          fi
          cd ref_app
          for f in *.xapk *.apks; do [ -f "$f" ] && unzip -q -o "$f" && rm -f "$f"; done
          ls -la
          ls -laR Android/obb 2>/dev/null | head -20 || true
          bt="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          base="$APP_ID.apk"
          [ -f "$base" ] || base="$(ls ./*.apk | head -1)"
          { "$bt/apksigner" verify --print-certs "$base" || true; } | grep -E "DN:|SHA-256|SHA-1" | tee signer.txt
          du -sh . || true

      - name: Save the app for later runs
        if: steps.app_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ref_app
          key: ref-app-${{ inputs.reference_app }}-${{ steps.week.outputs.w }}

      - name: Screen reader for the navigation
        if: inputs.nav_minutes != '0'
        run: sudo apt-get install -y -qq tesseract-ocr > /dev/null && tesseract --version | head -1

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 30: its image still translates 32-bit ARM apps (newer ones only 64-bit)
      - name: Install, launch and record on the emulator (API 30, x86_64)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disk-size: 16G
          ram-size: 6144M
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash LoneWolfArena/tools/ci/reference_probe.sh "$APP_ID" ref_app ref-results 12 "$NAV_MINUTES" ref_state

      - name: Save the game data for later runs
        if: always() && hashFiles('ref_state/**') != ''
        uses: actions/cache/save@v4
        with:
          path: ref_state
          key: ref-state-${{ inputs.reference_app }}-${{ github.run_id }}

      - name: Encrypt the results
        if: always()
        run: |
          [ -n "$RESULTS_KEY" ] || { echo "no results key: nothing is uploaded"; exit 0; }
          tar czf ref.tgz ref-results ref_app/signer.txt 2>/dev/null || tar czf ref.tgz --files-from /dev/null
          printf '%s' "$RESULTS_KEY" | base64 -d > pub.pem
          openssl rand -out k.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in ref.tgz -out ref.data -pass file:k.bin
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:oaep -in k.bin -out ref.key
          rm -f k.bin ref.tgz
          ls -la ref.data ref.key

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: reference-results
          path: |
            ref.data
            ref.key
          if-no-files-found: ignore
          retention-days: 1

  # The same private probe on a real phone (Firebase Test Lab, with GPU): the phone-side driver
  # in LoneWolfArena/tools/ci/devicelab installs the app, reads the screen and taps through like
  # reference_nav.py. The project's key comes from the GCP_TESTLAB_KEY secret; everything the run
  # returns is encrypted like the emulator probe's, and the public log only says how it went.
  devicelab:
    if: github.event_name == 'workflow_dispatch' && inputs.reference_app != '' && inputs.testlab_minutes != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      APP_ID: ${{ inputs.reference_app }}
      RESULTS_KEY: ${{ inputs.results_key }}
      TL_MINUTES: ${{ inputs.testlab_minutes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Week of the year (the app is fetched again once a week)
        id: week
        run: echo "w=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore the app from an earlier run
        uses: actions/cache/restore@v4
        with:
          path: ref_app
          key: ref-app-${{ inputs.reference_app }}-${{ steps.week.outputs.w }}

      - name: Fetch the app
        run: |
          [[ "$APP_ID" =~ ^[A-Za-z0-9._]+$ ]]
          [[ "$TL_MINUTES" =~ ^[0-9]{1,2}$ ]]
          mkdir -p ref_app
          if ! ls ref_app/*.apk > /dev/null 2>&1; then
            curl -fsSL --retry 3 -o apkeep https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu
            chmod +x apkeep
            ./apkeep -a "$APP_ID" -d apk-pure -o acknowledge_dangers=true ref_app > /dev/null
          fi
          cd ref_app
          for f in *.xapk *.apks; do [ -f "$f" ] && unzip -q -o "$f" && rm -f "$f"; done
          ls -la ./*.apk

      - name: Build the phone-side driver
        working-directory: LoneWolfArena/tools/ci/devicelab
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          JAVA_HOME="$JAVA_HOME_17_X64" "$RUNNER_TEMP/gradle-8.14.3/bin/gradle" --no-daemon -q assembleDebug assembleDebugAndroidTest
          ls -la app/build/outputs/apk/debug/*.apk app/build/outputs/apk/androidTest/debug/*.apk

      - name: Run on a real phone (Firebase Test Lab)
        env:
          GCP_KEY: ${{ secrets.GCP_TESTLAB_KEY }}
        run: |
          mkdir -p tl-results
          [ -n "$GCP_KEY" ] || { echo "no GCP_TESTLAB_KEY secret"; exit 1; }
          printf '%s' "$GCP_KEY" > "$RUNNER_TEMP/gcp.json"
          trap 'rm -f "$RUNNER_TEMP/gcp.json"' EXIT
          L=tl-results/gcloud.txt
          PROJECT="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["project_id"])' "$RUNNER_TEMP/gcp.json")"
          gcloud auth activate-service-account --key-file "$RUNNER_TEMP/gcp.json" --quiet >> "$L" 2>&1
          gcloud config set project "$PROJECT" --quiet >> "$L" 2>&1
          gcloud services enable testing.googleapis.com toolresults.googleapis.com --quiet >> "$L" 2>&1 \
            && echo "APIs on" || { echo "could not turn the Test Lab APIs on"; exit 1; }
          # A physical phone that still runs 32-bit ARM apps; Samsung first, newest Android first.
          gcloud firebase test android models list --filter="form=PHYSICAL" --format=json > tl-results/models.json 2>> "$L"
          read -r MODEL VERSION < <(python3 - tl-results/models.json <<'PY'
          import json, sys
          ms = [m for m in json.load(open(sys.argv[1]))
                if "armeabi-v7a" in m.get("supportedAbis", []) and "deprecated" not in " ".join(m.get("tags", []))]
          ms.sort(key=lambda m: (m.get("manufacturer", "").lower() != "samsung", -max(int(v) for v in m["supportedVersionIds"])))
          m = ms[0]
          print(m["id"], max(m["supportedVersionIds"], key=int))
          PY
          )
          echo "phone: $MODEL, Android API $VERSION"
          FILES=""
          for f in ref_app/*.apk; do FILES="$FILES,/sdcard/ffdrv/$(basename "$f")=$f"; done
          D=LoneWolfArena/tools/ci/devicelab/app/build/outputs/apk
          gcloud firebase test android run --type instrumentation \
            --app "$D/debug/app-debug.apk" --test "$D/androidTest/debug/app-debug-androidTest.apk" \
            --device "model=$MODEL,version=$VERSION,orientation=landscape" \
            --other-files "${FILES#,}" \
            --environment-variables "minutes=$TL_MINUTES,pkg=$APP_ID,apks=/sdcard/ffdrv" \
            --directories-to-pull /sdcard/Android/data/org.lonewolf.devicelab/files \
            --timeout "$((TL_MINUTES + 12))m" --results-dir "ffdrv-$GITHUB_RUN_ID" --quiet >> "$L" 2>&1 \
            && echo "test run finished" || echo "test run ended with an error (details in the results)"
          BUCKET="$(grep -oE 'test-lab-[a-z0-9-]+' "$L" | head -1)"
          [ -n "$BUCKET" ] && gsutil -m -q cp -r "gs://$BUCKET/ffdrv-$GITHUB_RUN_ID" tl-results/ >> "$L" 2>&1 \
            && echo "results downloaded: $(du -sh tl-results | cut -f1)" || echo "no results to download"

      - name: Encrypt the results
        if: always()
        run: |
          [ -n "$RESULTS_KEY" ] || { echo "no results key: nothing is uploaded"; exit 0; }
          tar czf ref.tgz tl-results 2>/dev/null || tar czf ref.tgz --files-from /dev/null
          printf '%s' "$RESULTS_KEY" | base64 -d > pub.pem
          openssl rand -out k.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in ref.tgz -out ref.data -pass file:k.bin
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:oaep -in k.bin -out ref.key
          rm -f k.bin ref.tgz
          ls -la ref.data ref.key

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: devicelab-results
          path: |
            ref.data
            ref.key
          if-no-files-found: ignore
          retention-days: 1

