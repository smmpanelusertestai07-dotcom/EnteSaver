name: build

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

# Read-only for every job; the release job alone asks for write, to publish.
permissions:
  contents: read

env:
  # The Ente Saver release certificate (public). Every release is signed by
  # this key and only this key: Android installs an update only from the key
  # the app was first installed with.
  RELEASE_CERT_SHA256: 71e76aa0076e4c28a098c6d1c400001661516505f92fe2d810fc9e46d478041b

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # A named image, not ubuntu-latest: "latest" moves to a newer Ubuntu
    # (24.04 to 26.04 from 19 October 2026) with other preinstalled tools,
    # and a release build should change only when this file does. 26.04 is
    # the newest LTS, so this label stays supported the longest.
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      throwaway_key: ${{ steps.keystore.outputs.generated }}
      sign_mode: ${{ steps.keystore.outputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The token is not left in .git/config for the build to find.
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      # The certificate first: its SHA-256 is embedded into the APK (tamper
      # evidence), so it must be known before the build. No key is opened
      # in this job at all: it runs Gradle, its plugins and every
      # dependency, and none of that needs the key or its passwords. The
      # sign job, on a runner of its own, signs.
      #
      # - release: the signing secrets are set, and the APK will carry
      #   RELEASE_CERT_SHA256. The sign job checks the key really is that
      #   one before it signs anything.
      # - throwaway: no secrets (a fork). The sign job signs with a key that
      #   lives for that job only, and the release job refuses the result.
      #   The APK carries no certificate to check itself against, as a
      #   developer build does not.
      - name: Choose the signing certificate
        id: keystore
        env:
          HAS_RELEASE_KEY: ${{ secrets.KEYSTORE_B64 != '' }}
        run: |
          set -eu
          if [ "$HAS_RELEASE_KEY" = "true" ]; then
            echo "CERT_SHA256=$RELEASE_CERT_SHA256" >> "$GITHUB_ENV"
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "generated=false" >> "$GITHUB_OUTPUT"
            echo "The release key is in repository secrets; only the sign job opens it."
          else
            echo "CERT_SHA256=" >> "$GITHUB_ENV"
            echo "mode=throwaway" >> "$GITHUB_OUTPUT"
            echo "generated=true" >> "$GITHUB_OUTPUT"
            echo "No signing secrets found - the sign job will use a key that exists for that job only."
          fi

      - name: Lint, unit tests, release build
        run: >
          ./gradlew --no-daemon lint testDebugUnitTest assembleRelease
          -PsigningCertSha256=${{ env.CERT_SHA256 }}

      - name: Name the APK
        run: |
          set -eu
          VERSION=$(./gradlew -q printVersionName --no-daemon | tail -1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # Aligned here, where the build tools are already in use; signing
      # rewrites the archive's signature block, not its entries.
      - name: Align the unsigned APK
        run: |
          set -eu
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          [ -f "$UNSIGNED" ] || UNSIGNED=app/build/outputs/apk/release/app-release.apk
          # -P 16, not -p: -p is the old 4 KiB rule, and Android 16 runs an
          # app whose .so files are not 16 KiB aligned in a compatibility
          # mode with a launch-time system dialog rather than refusing to
          # install it - so a wrong answer here ships and looks fine in CI.
          # -P <kb> is a flag; <align> stays a positional argument, so the 4
          # is still required. Writing "-P 16 in out" prints the usage text
          # and produces no file - caught by signing a real APK by hand
          # rather than by reading the flag name and assuming.
          "$BT/zipalign" -f -P 16 4 "$UNSIGNED" EnteSaver-unsigned.apk

      - name: Publish version for later jobs
        id: meta
        run: echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload the unsigned APK
        uses: actions/upload-artifact@v6
        with:
          name: EnteSaver-unsigned.apk
          path: EnteSaver-unsigned.apk
          if-no-files-found: error
          # Only the sign job of this run reads it.
          retention-days: 3

  sign:
    # On a runner of its own, which never runs the build. Gradle, its
    # plugins and every dependency ran on the build's runner as the same
    # user, where they could have left something behind for the step that
    # holds the key - a changed script, a changed tool, a line in
    # GITHUB_ENV. Here nothing runs before the signing but a fresh checkout
    # and the download of the unsigned APK.
    name: sign
    needs: build
    runs-on: ubuntu-26.04  # the build's image (see there)
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The token is not left in .git/config.
          persist-credentials: false

      # keytool and apksigner run on Java; GitHub's own action, no Gradle.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download the unsigned APK
        uses: actions/download-artifact@v7
        with:
          name: EnteSaver-unsigned.apk

      # What the build reported, checked before it names any file: a version
      # is digits and dots, and the mode is one of the two.
      - name: Name the APK
        env:
          BUILT_VERSION: ${{ needs.build.outputs.version }}
          BUILT_MODE: ${{ needs.build.outputs.sign_mode }}
        run: |
          set -eu
          if ! printf '%s' "$BUILT_VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$'; then
            echo "::error::The build reported version '$BUILT_VERSION'"
            exit 1
          fi
          case "$BUILT_MODE" in release|throwaway) ;; *) echo "::error::Unknown signing mode '$BUILT_MODE'"; exit 1 ;; esac
          VERSION="$BUILT_VERSION"
          {
            echo "VERSION=$VERSION"
            echo "SIGN_MODE=$BUILT_MODE"
            echo "APK_NAME=EnteSaver-v$VERSION-release.apk"
          } >> "$GITHUB_ENV"

      # The key and its passwords exist in this step alone: decoded into the
      # runner's temporary folder, checked, used and removed again.
      - name: Sign APK (apksigner - v2+v3)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          umask 077
          KS="$RUNNER_TEMP/release.p12"
          trap 'rm -f "$KS"' EXIT
          if [ "$SIGN_MODE" = release ]; then
            if [ -z "$KEYSTORE_B64" ]; then
              echo "::error::The build embedded the release certificate, but no signing key reached this job"
              exit 1
            fi
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS"
            export KEYSTORE_PASSWORD="$SECRET_KEYSTORE_PASSWORD"
            export KEY_PASSWORD="${SECRET_KEY_PASSWORD:-$SECRET_KEYSTORE_PASSWORD}"
            ALIAS="${SECRET_KEY_ALIAS:-entesaver}"
            CERT_SHA=$(keytool -exportcert -keystore "$KS" -alias "$ALIAS" -storepass:env KEYSTORE_PASSWORD -rfc \
              | openssl x509 -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr 'A-F' 'a-f' || true)
            if [ "$CERT_SHA" != "$RELEASE_CERT_SHA256" ]; then
              echo "::error title=KEYSTORE_B64 is not the Ente Saver release key::It holds certificate '$CERT_SHA' (empty: KEYSTORE_PASSWORD or KEY_ALIAS does not open it), but releases are signed with $RELEASE_CERT_SHA256. Use the four values from the secrets file."
              exit 1
            fi
          else
            # A key for this job only: it is never written anywhere but
            # this runner's temporary folder, and goes with it.
            KEYSTORE_PASSWORD=$(openssl rand -hex 16)
            echo "::add-mask::$KEYSTORE_PASSWORD"
            export KEYSTORE_PASSWORD
            export KEY_PASSWORD="$KEYSTORE_PASSWORD"
            ALIAS=entesaver
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias "$ALIAS" \
              -keyalg RSA -keysize 4096 -validity 9125 \
              -storepass:env KEYSTORE_PASSWORD -keypass:env KEY_PASSWORD \
              -dname "CN=Ente Saver Release, OU=Ente Saver, O=Ente Saver"
            CERT_SHA=$(keytool -exportcert -keystore "$KS" -alias "$ALIAS" -storepass:env KEYSTORE_PASSWORD -rfc \
              | openssl x509 -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr 'A-F' 'a-f')
          fi
          echo "CERT_SHA256=$CERT_SHA" >> "$GITHUB_ENV"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          # The one signing recipe (sign-apk.sh).
          SIGN_KS="$KS" SIGN_KS_ALIAS="$ALIAS" bash .github/scripts/sign-apk.sh EnteSaver-unsigned.apk "$APK_NAME"
          "$BT/apksigner" verify --print-certs "$APK_NAME"
          # The emulator job installs a fixed name, so keep one alongside it.
          cp "$APK_NAME" EnteSaver-release.apk

      # Every release must be signed by the release key and nothing else, or
      # it would not install over the Ente Saver already on phones. (A
      # throwaway-key build never publishes; the release job refuses it.)
      - name: The APK is signed by the release key
        if: needs.build.outputs.sign_mode != 'throwaway'
        run: bash .github/scripts/check-signer.sh "$APK_NAME" "$RELEASE_CERT_SHA256"

      - name: Alignment gate (16 KiB pages, Android 16)
        run: |
          set -eu
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          # Checked on the SIGNED file, because signing rewrites the archive.
          # Today AGP already emits 16 KiB-aligned entries, so this passes by
          # inheritance; the point of the gate is that a future change which
          # shifts an entry cannot land a shared library on a 4 KiB-but-not-
          # 16 KiB boundary without the build going red.
          "$BT/zipalign" -c -P 16 -v 4 "$APK_NAME" > /dev/null
          # zipalign only checks where each library starts in the archive; a
          # library linked for 4 KiB pages inside it still needs this.
          python3 .github/scripts/check-elf-16k.py "$APK_NAME"
          echo "16 KiB page alignment verified on $APK_NAME"

      - name: Size gate (max 15 MB)
        run: |
          set -eu
          SIZE=$(stat -c%s "$APK_NAME")
          echo "APK size: $SIZE bytes ($(( SIZE / 1048576 )) MiB)"
          if [ "$SIZE" -gt 15728640 ]; then
            echo "::error::APK exceeds the 15 MB limit"
            exit 1
          fi
          echo "APK_SIZE=$SIZE" >> "$GITHUB_ENV"

      - name: Compute checksums and version
        run: |
          set -eu
          APK_SHA=$(sha256sum "$APK_NAME" | cut -d' ' -f1)
          echo "APK_SHA256=$APK_SHA" >> "$GITHUB_ENV"
          echo "Version: $VERSION / APK SHA-256: $APK_SHA"

      - name: Generate release notes
        run: |
          set -eu
          KEYSTORE_NOTE=""
          if [ "${{ needs.build.outputs.throwaway_key }}" = "true" ]; then
            KEYSTORE_NOTE="This build was signed with a throwaway key that existed only inside its CI run, because no signing secrets are configured. It therefore CANNOT be installed over any other Ente Saver build. The release step refuses to publish it until the four signing secrets are set."
          fi
          cat > RELEASE_NOTES.md <<EOF
          Ente Saver, made for Ente Photos.

          Makes your photos and videos smaller on the phone, each at the quality
          its picture needs, within the size limits of Google Photos' Storage
          saver (16 MP, 1080p). Every file keeps its format, name, album and dates,
          and a file is never made smaller twice.

          Two ways to save space, in Settings › Saving space:
          - Replace on this phone (the default): the smaller version takes the
            original's place in the same file, so Ente Photos uploads it in place
            of the original and your Ente storage shrinks too. The original waits
            in the phone's trash for 30 days, and Files can put it back.
          - Copies for Ente: smaller copies go to Pictures/EnteSaver for Ente
            Photos to back up, and the originals stay until you free them.

          Coming from Ente Saver 12.2 or older (app.cloudsaver)? That is a
          different app to Android: install this one, tap "Restore from a saved
          file" on its first screen and choose history.json in Documents › Ente
          Saver, then uninstall the earlier one.

          No server, no account, no analytics, no internet permission, nothing
          that expires.

          Needs Android 9 or newer. Install: download ${APK_NAME} below and
          open it on your phone.
          Play Protect may warn about an app installed from a file — choose
          "More details" › "Install anyway". The app holds no INTERNET permission.

          APK SHA-256: ${APK_SHA256}
          Signing cert SHA-256: ${CERT_SHA256}
          ${KEYSTORE_NOTE}
          EOF
          echo "Release notes generated."

      - name: Job summary
        run: |
          {
            echo "## Ente Saver build ${VERSION}"
            echo ""
            echo "- APK size: ${APK_SIZE} bytes"
            echo "- APK SHA-256: \`${APK_SHA256}\`"
            echo "- Signing cert SHA-256: \`${CERT_SHA256}\`"
            echo "- Signing: ${SIGN_MODE}"
            if [ "${{ needs.build.outputs.throwaway_key }}" = "true" ]; then
              echo ""
              echo "### No signing key is configured, so this build cannot be published"
              echo ""
              echo "This run signed the APK with a key it invented and then threw away, so the"
              echo "APK cannot install over any other Ente Saver build. The release step refuses"
              echo "to publish it. Add the four values from the Ente Saver secrets file in"
              echo "Settings -> Secrets and variables -> Actions -> New repository secret:"
              echo "\`KEYSTORE_B64\`, \`KEYSTORE_PASSWORD\`, \`KEY_ALIAS\`, \`KEY_PASSWORD\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: EnteSaver-release.apk
          path: |
            ${{ env.APK_NAME }}
            EnteSaver-release.apk
            RELEASE_NOTES.md
          if-no-files-found: error
          # The release is the lasting copy; a run's own copy need not outlive a fortnight.
          retention-days: 14

  emulator:
    # Every Android this app installs on, from minSdk to targetSdk, not just
    # the one that happens to be current. The behaviour genuinely differs
    # across them: 28 has no scoped storage, so every copy is a file written
    # with storage write access and found by the media scanner; 29 has no
    # media trash and no batch delete request, 30 introduces both, 31 adds
    # wallpaper colours, 33 adds the runtime notification permission. A suite
    # that only ever runs on one level says nothing about the phones the
    # other rows describe.
    name: end-to-end on Android ${{ matrix.api }}
    needs: [build, sign]
    runs-on: ubuntu-26.04  # the build's image (see there)
    timeout-minutes: 75
    # Android 17 (API 37) runs ahead of the target, to see early what the
    # next version changes; until it is the target it may fail without
    # holding anything up.
    continue-on-error: ${{ matrix.ahead == true }}
    strategy:
      # One level failing must not hide the others: the whole point is to
      # learn which Androids are affected, not just that something is.
      fail-fast: false
      matrix:
        api: [28, 29, 30, 31, 32, 33, 34, 35, 36]
        include:
          # The SDK names Android 17's packages "android-37.0", not "android-37".
          - api: 37
            image: "37.0"
            ahead: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The token is not left in .git/config for the build to find.
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      # A stock runner has ~7.3 GB free, and the AVD wants 7.37 GB for its
      # userdata partition alone - it dies at launch with "Not enough space to
      # create userdata partition". None of these toolchains are used here.
      - name: Free disk space for the emulator
        run: |
          echo "Before:"
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android/sdk/ndk \
                      /opt/hostedtoolcache/CodeQL \
                      /usr/share/dotnet \
                      /usr/share/swift \
                      /opt/ghc /usr/local/.ghcup \
                      /usr/local/share/boost \
                      /usr/local/share/powershell || true
          docker image prune -af || true
          echo "After:"
          df -h / | tail -1

      # The runner has the hardware but not the permission by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download signed APK
        uses: actions/download-artifact@v7
        with:
          name: EnteSaver-release.apk

      # Google's download of the system image is sometimes cut short ("Error
      # on ZipFile unknown archive"), and the emulator step then fails before
      # a single test runs. Fetch it here, a few tries apart; the next step
      # finds it installed and moves on.
      - name: Install the system image
        run: |
          image="android-${{ matrix.image || matrix.api }}"
          # cmdline-tools/latest where the image has it, else its newest
          # numbered copy.
          sdkmanager=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          for try in 1 2 3; do
            if yes | "$sdkmanager" --install \
                 "system-images;$image;google_apis;x86_64" > /dev/null \
               && [ -d "$ANDROID_HOME/system-images/$image/google_apis/x86_64" ]; then
              exit 0
            fi
            echo "Download $try of the $image image failed; trying again."
            sleep 20
          done
          exit 1

      - name: Run instrumented suite + live install on a real emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          # The update-over-the-last-release check downloads that release.
          GH_TOKEN: ${{ github.token }}
          THROWAWAY_KEY: ${{ needs.build.outputs.throwaway_key }}
        with:
          api-level: ${{ matrix.image || matrix.api }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          # Well under the 7.37 GB default; the suite writes only a few MB.
          # (disk.dataPartition.size takes a suffix - hw.ramSize does not,
          # which is why ram-size must stay unset.)
          disk-size: 6G
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          # One line: the action runs each script line in its own `sh -c`,
          # so variables and multi-line blocks cannot live here.
          script: bash .github/scripts/emulator-e2e.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: emulator-screenshots-api${{ matrix.api }}
          path: |
            artifacts/screenshots
            artifacts/logcat.txt
            artifacts/logcat-crash.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload instrumentation report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: emulator-test-report-api${{ matrix.api }}
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 14

  release:
    name: publish release
    needs: [build, sign, emulator]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04  # the build's image (see there)
    # The one job that writes: it creates the tag and the release.
    permissions:
      contents: write
    steps:
      # A release nobody can install as an update is not a release.
      #
      # With no signing secrets set, the build step invents a key, signs with
      # it, and throws it away. Android refuses an APK whose signer differs
      # from the installed app, so every such build is a fresh uninstall - and
      # three consecutive releases really did carry three different
      # certificates. Publishing more of them buries the working one deeper,
      # so this refuses instead, and says exactly what to do about it.
      - name: A published release needs a signing key that outlives the run
        if: needs.build.outputs.throwaway_key == 'true'
        run: |
          echo "::error title=No signing key configured::This APK was signed with a key that existed only inside this run, so it cannot install over any other Ente Saver build. Refusing to publish it."
          cat >&2 <<'MSG'

          Add the four values from the Ente Saver secrets file in
          Settings -> Secrets and variables -> Actions -> New repository secret:
            KEYSTORE_B64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
          MSG
          exit 1

      - name: Download signed APK
        uses: actions/download-artifact@v7
        with:
          name: EnteSaver-release.apk

      - name: Publish the GitHub Release, once
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          TAG="v${VERSION}"
          # A published tag is one binary, for good.
          #
          # The notes print that APK's SHA-256 and the fingerprint of the
          # certificate it was signed with, and with no signing secret set CI
          # mints a fresh keystore on every run - so re-uploading over a tag
          # that already exists hands a differently-signed file, under a
          # different hash, to everyone who downloaded the first one. Their
          # phone then refuses to install it over what they have, and the
          # hash they were told to check no longer matches the file they got.
          #
          # This is not hypothetical: when another project shared this
          # repository, each of its pushes to main re-ran this job and
          # silently re-signed the last release.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::$TAG is already published - leaving it exactly as it is."
            echo "To publish a new build, raise versionName in app/build.gradle.kts."
            exit 0
          fi
          # Tagged at the commit this run built, not at whatever main points
          # to now. Without --target GitHub creates a missing tag from the
          # branch head at the moment of this call, and a push that landed
          # while the emulator legs ran would get the tag and the source
          # archive, while the APK and its hash came from the commit before.
          gh release create "$TAG" "EnteSaver-v${VERSION}-release.apk" \
            --target "$GITHUB_SHA" \
            --title "Ente Saver $TAG" \
            --notes-file RELEASE_NOTES.md \
            --repo "$GITHUB_REPOSITORY"
