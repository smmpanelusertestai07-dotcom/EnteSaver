name: savings-bench

# How much room Ente Saver makes on a phone full of ordinary videos. Not a
# test that passes or fails: it fills emulators with a ~46 GB phone's worth of
# videos (made shorter, same resolution, frame rate, codec and bitrate), runs
# the app's own pipeline over them under Balanced, and writes what it saved.
# Runs when the benchmark itself changes, or by hand.
on:
  workflow_dispatch:
  push:
    branches:
      - "claude/**"
    paths:
      - ".github/bench/**"
      - ".github/workflows/savings-bench.yml"
      - "app/src/androidTest/kotlin/app/entesaver/SavingsBenchTest.kt"

permissions:
  contents: read

concurrency:
  group: savings-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apks:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v5

      # Debug builds: the app and its test APK must share a signing key, and
      # one Gradle run gives both the same debug key.
      - name: Build the app and the benchmark
        run: |
          ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
          mkdir -p bench-apks
          cp app/build/outputs/apk/debug/app-debug.apk bench-apks/
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk bench-apks/

      - name: Upload the APKs
        uses: actions/upload-artifact@v6
        with:
          name: bench-apks
          path: bench-apks
          if-no-files-found: error

  shard:
    name: shard ${{ matrix.shard }}
    needs: apks
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Free disk space for the library and the emulator
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk \
                      /opt/hostedtoolcache/CodeQL \
                      /usr/share/dotnet \
                      /usr/share/swift \
                      /opt/ghc /usr/local/.ghcup \
                      /usr/local/share/boost \
                      /usr/local/share/powershell || true
          docker image prune -af || true
          df -h / | tail -1

      - name: Install ffmpeg
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg
          ffmpeg -hide_banner -version | head -1

      - name: Make this shard's videos
        run: python3 .github/bench/library.py make --shard ${{ matrix.shard }} --shards 8 --out bench-library

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download the APKs
        uses: actions/download-artifact@v7
        with:
          name: bench-apks

      - name: Install the system image
        run: |
          sdkmanager=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          for try in 1 2 3; do
            if yes | "$sdkmanager" --install "system-images;android-34;google_apis;x86_64" > /dev/null \
               && [ -d "$ANDROID_HOME/system-images/android-34/google_apis/x86_64" ]; then
              exit 0
            fi
            echo "Download $try of the image failed; trying again."
            sleep 20
          done
          exit 1

      # Android 14 with 6 GB of memory: what a Realme 11 Pro 5G runs, and
      # enough that Ente Saver treats it as an ordinary phone, not a small one.
      - name: Run the benchmark on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 6144M
          cores: 4
          disk-size: 16G
          force-avd-creation: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash .github/bench/run-on-emulator.sh ${{ matrix.shard }}

      - name: Upload this shard's results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bench-shard-${{ matrix.shard }}
          path: |
            bench-out
            bench-library-made.csv
          if-no-files-found: warn

  report:
    needs: shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download every shard's results
        uses: actions/download-artifact@v7
        with:
          pattern: bench-shard-*
          path: shards

      - name: Work out the saving
        run: |
          python3 .github/bench/library.py manifest --shards 8 --out manifest.csv
          python3 .github/bench/report.py --manifest manifest.csv --shards shards --out bench-report
          cat bench-report/summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        uses: actions/upload-artifact@v6
        with:
          name: bench-report
          path: |
            bench-report
            manifest.csv
          if-no-files-found: error
